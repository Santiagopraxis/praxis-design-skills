<link rel="stylesheet" href="../styles.css">
<style>
.ic-row{display:flex;gap:14px;padding:20px;flex-wrap:wrap}
.ic-cell{display:flex;flex-direction:column;align-items:center;gap:6px;width:90px}
.ic-cell img{width:48px;height:48px;object-fit:contain}
.ic-cell span{font-family:var(--font-body);font-size:10.5px;color:var(--ink-500);text-align:center}
</style>
<div class="ic-row" style="background:var(--surface)">
  <div class="ic-cell"><img src="../assets/icons/api-gray.png"><span>API</span></div>
  <div class="ic-cell"><img src="../assets/icons/base-de-datos-gray.png"><span>Base de datos</span></div>
  <div class="ic-cell"><img src="../assets/icons/transferencia-gray.png"><span>Transferencia</span></div>
  <div class="ic-cell"><img src="../assets/icons/mundo-divisas-gray.png"><span>Mundo / divisas</span></div>
  <div class="ic-cell"><img src="../assets/icons/persona-banco-gray.png"><span>Persona / banco</span></div>
  <div class="ic-cell"><img src="../assets/icons/sitio-gray.png"><span>Sitio</span></div>
</div>
<div class="ic-row" style="background:var(--purple-950)">
  <div class="ic-cell"><img src="../assets/icons/api-white.png"><span style="color:var(--text-inverse-muted)">API</span></div>
  <div class="ic-cell"><img src="../assets/icons/base-de-datos-white.png"><span style="color:var(--text-inverse-muted)">Base de datos</span></div>
  <div class="ic-cell"><img src="../assets/icons/transferencia-white.png"><span style="color:var(--text-inverse-muted)">Transferencia</span></div>
  <div class="ic-cell"><img src="../assets/icons/mundo-divisas-white.png"><span style="color:var(--text-inverse-muted)">Mundo / divisas</span></div>
  <div class="ic-cell"><img src="../assets/icons/persona-banco-white.png"><span style="color:var(--text-inverse-muted)">Persona / banco</span></div>
  <div class="ic-cell"><img src="../assets/icons/sitio-white.png"><span style="color:var(--text-inverse-muted)">Sitio</span></div>
</div>

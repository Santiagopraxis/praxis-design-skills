<!-- @dsCard group="Colors" viewport="700x160" subtitle="Cool, low-chroma neutrals" name="Neutrals" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:140px;font-family:var(--font-body)">
  <div style="flex:1;background:var(--paper);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--ink-500)">paper</div>
  <div style="flex:1;background:var(--surface);border-left:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--ink-500)">surface</div>
  <div style="flex:1;background:var(--surface-sunken);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--ink-500)">sunken</div>
  <div style="flex:1;background:var(--ink-300);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--surface)">ink-300</div>
  <div style="flex:1;background:var(--ink-500);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--surface)">ink-500</div>
  <div style="flex:1;background:var(--ink-700);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--surface)">ink-700</div>
  <div style="flex:1;background:var(--ink-900);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--surface)">ink-900</div>
</div>

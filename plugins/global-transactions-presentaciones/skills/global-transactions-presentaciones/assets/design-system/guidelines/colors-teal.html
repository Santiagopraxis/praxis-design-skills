<!-- @dsCard group="Colors" viewport="700x160" subtitle="Secondary accent, from the Global Transactions ring" name="Teal" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:140px;font-family:var(--font-body)">
  <div style="flex:1;background:var(--teal-300);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--ink-900)">teal-300</div>
  <div style="flex:1;background:var(--teal-500);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff">teal-500</div>
  <div style="flex:1;background:var(--teal-700);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff">teal-700</div>
  <div style="flex:1;background:var(--status-critical);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff">critical</div>
  <div style="flex:1;background:var(--status-warning);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff">warning</div>
  <div style="flex:1;background:var(--status-ok);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff">ok</div>
</div>

<!-- @dsCard group="Components" viewport="700x160" name="Timeline" -->
<link rel="stylesheet" href="../../styles.css">
<style>
.tl{display:flex;width:100%}
.tl-step{flex:1;display:flex;flex-direction:column;align-items:center}
.tl-row{display:flex;align-items:center;width:100%}
.tl-line{flex:1;height:2px}
.tl-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.tl-label{margin-top:10px;text-align:center;font-family:var(--font-body)}
</style>
<div style="padding:30px 24px">
  <div class="tl">
    <div class="tl-step">
      <div class="tl-row"><div class="tl-line" style="background:transparent"></div><div class="tl-dot" style="background:var(--teal-500)"></div><div class="tl-line" style="background:var(--teal-500)"></div></div>
      <div class="tl-label"><div style="font-size:11px;color:var(--ink-500);font-weight:600">20 Ago</div><div style="font-size:13px;color:var(--ink-900);font-weight:700;margin-top:2px">Kick-off</div></div>
    </div>
    <div class="tl-step">
      <div class="tl-row"><div class="tl-line" style="background:var(--teal-500)"></div><div class="tl-dot" style="background:var(--purple-600)"></div><div class="tl-line" style="background:var(--purple-600)"></div></div>
      <div class="tl-label"><div style="font-size:11px;color:var(--ink-500);font-weight:600">25 Ago</div><div style="font-size:13px;color:var(--ink-900);font-weight:700;margin-top:2px">Desarrollo</div></div>
    </div>
    <div class="tl-step">
      <div class="tl-row"><div class="tl-line" style="background:var(--purple-600)"></div><div class="tl-dot" style="background:var(--border-strong)"></div><div class="tl-line" style="background:var(--border-strong)"></div></div>
      <div class="tl-label"><div style="font-size:11px;color:var(--ink-500);font-weight:600">21 Sep</div><div style="font-size:13px;color:var(--ink-900);font-weight:700;margin-top:2px">Certificación</div></div>
    </div>
    <div class="tl-step">
      <div class="tl-row"><div class="tl-line" style="background:var(--border-strong)"></div><div class="tl-dot" style="background:var(--border-strong)"></div><div class="tl-line" style="background:transparent"></div></div>
      <div class="tl-label"><div style="font-size:11px;color:var(--ink-500);font-weight:600">28 Sep</div><div style="font-size:13px;color:var(--ink-900);font-weight:700;margin-top:2px">Go Live</div></div>
    </div>
  </div>
</div>

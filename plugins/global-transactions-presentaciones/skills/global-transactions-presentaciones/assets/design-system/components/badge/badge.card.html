<!-- @dsCard group="Components" viewport="700x150" name="Badge" -->
<link rel="stylesheet" href="../../styles.css">
<style>
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;font-size:13px;font-weight:600;letter-spacing:0.02em;border-radius:var(--radius-pill);font-family:var(--font-body);white-space:nowrap}
</style>
<div style="display:flex;flex-wrap:wrap;gap:10px;padding:20px;align-items:center">
  <span class="badge" style="background:var(--surface-sunken);color:var(--ink-700)">Neutral</span>
  <span class="badge" style="background:var(--purple-100);color:var(--purple-600)">Instapay</span>
  <span class="badge" style="background:var(--teal-300);color:var(--teal-700)">Global Transactions</span>
  <span class="badge" style="background:color-mix(in oklch, var(--flame-500) 14%, white);color:var(--flame-600)">Bloqueador</span>
  <span class="badge" style="background:color-mix(in oklch, var(--status-warning) 16%, white);color:#8a5a12">Riesgo</span>
  <span class="badge" style="background:color-mix(in oklch, var(--teal-700) 12%, white);color:var(--teal-700)">En curso</span>
  <span style="background:var(--purple-950);padding:10px;border-radius:10px"><span class="badge" style="background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.18)">Sobre oscuro</span></span>
</div>

<!-- @dsCard group="Components" viewport="700x260" name="Card & StatCard" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;gap:14px;padding:20px;background:var(--bg-page);flex-wrap:wrap;font-family:var(--font-body)">
  <div style="width:220px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:20px">
    <div style="font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--ink-500);margin-bottom:8px">Objetivo</div>
    <div style="font-family:var(--font-display);font-size:18px;font-weight:700;margin-bottom:8px">Conexión & Core</div>
    <div style="font-size:14px;line-height:var(--lh-normal);color:var(--ink-700)">Integración directa con SPBVI Credibanco y conexión fluida con el core interno.</div>
  </div>
  <div style="width:220px;background:var(--purple-900);border-radius:var(--radius-md);padding:20px;color:var(--text-inverse)">
    <div style="font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-inverse-muted);margin-bottom:8px">Fase</div>
    <div style="font-family:var(--font-display);font-size:18px;font-weight:700;margin-bottom:8px">Certificación E2E</div>
    <div style="font-size:14px;line-height:var(--lh-normal);color:var(--text-inverse-muted)">Ejecución exhaustiva de pruebas integrales para un Go-Live sin fricción.</div>
  </div>
  <div style="background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:20px;min-width:140px;font-family:var(--font-display)">
    <div style="font-size:36px;font-weight:800;color:var(--purple-600);letter-spacing:var(--tracking-tight)">4</div>
    <div style="font-size:12px;color:var(--ink-500);font-family:var(--font-body);margin-top:4px">Fases del proyecto</div>
  </div>
  <div style="background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:20px;min-width:140px;font-family:var(--font-display)">
    <div style="font-size:36px;font-weight:800;color:var(--teal-700);letter-spacing:var(--tracking-tight)">28 Sep</div>
    <div style="font-size:12px;color:var(--ink-500);font-family:var(--font-body);margin-top:4px">Fecha de Go-Live</div>
  </div>
</div>

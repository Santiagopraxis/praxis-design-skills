<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;display:grid;grid-template-columns:1fr 1fr;height:420px}
.cell{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.dark{background:#000}
.light{background:#fff}
img{height:64px;width:auto}
.lbl{font:500 11px/1 var(--flx-font-sans);letter-spacing:0.14em;text-transform:uppercase}
.dark .lbl{color:rgba(255,255,255,0.45)}
.light .lbl{color:rgba(10,10,10,0.45)}
</style>
</head><body>
<div class="cell dark"><img src="../assets/logo-fluxone-blanco.png" alt="fluX One blanco"><div class="lbl">Sobre negro</div></div>
<div class="cell light"><img src="../assets/logo-fluxone-negro.png" alt="fluX One negro"><div class="lbl">Sobre blanco</div></div>
</body></html>

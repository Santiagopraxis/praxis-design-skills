<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0}.row{display:grid;grid-template-columns:1fr 1fr;height:260px}.col{display:flex;flex-direction:column}.sw{flex:1;display:flex;align-items:center;padding:0 16px;font:var(--flx-mono-s)}</style>
</head><body>
<div class="row">
<div class="col flx-dark">
<div class="sw" style="background:#000">#000000 black</div>
<div class="sw" style="background:var(--flx-d-surface-1)">surface-1 #0d0d0d</div>
<div class="sw" style="background:var(--flx-d-surface-2)">surface-2 #161616</div>
<div class="sw" style="background:var(--flx-d-surface-3)">surface-3 #202020</div>
</div>
<div class="col flx-light">
<div class="sw" style="background:#fff">#ffffff white</div>
<div class="sw" style="background:var(--flx-l-surface-1)">surface-1 #f7f7f8</div>
<div class="sw" style="background:var(--flx-l-surface-2)">surface-2 #eeeef0</div>
<div class="sw" style="background:var(--flx-l-surface-3)">surface-3 #e2e2e6</div>
</div>
</div>
</body></html>

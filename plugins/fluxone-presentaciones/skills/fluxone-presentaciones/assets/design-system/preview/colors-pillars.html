<!-- @dsCard group="Colors" viewport="700x220" name="Paleta de 4 pilares" subtitle="Cobrar · Conciliar · Pagar · Decidir" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;background:#f2f2f4;padding:24px;box-sizing:border-box}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.sw{aspect-ratio:1.3/1;border-radius:var(--flx-r-md);border:1px solid;display:flex;flex-direction:column;justify-content:space-between;padding:20px 18px;background:#fff}.sw .name{font:var(--flx-meta);color:#0a0a0a;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px}.sw .hex{font:var(--flx-mono);color:rgba(10,10,10,0.6);margin-top:auto}</style>
</head><body>
<div class="row">
<div class="sw" style="border-color:#3CB8EB;box-shadow:var(--flx-glow-cobrar)"><div class="name" style="color:#3CB8EB">Cobrar</div><div class="hex">#3CB8EB</div></div>
<div class="sw" style="border-color:#AB4B96;box-shadow:var(--flx-glow-conciliar)"><div class="name" style="color:#AB4B96">Conciliar</div><div class="hex">#AB4B96</div></div>
<div class="sw" style="border-color:#F5B5D2;box-shadow:var(--flx-glow-pagar)"><div class="name" style="color:#F5B5D2">Pagar</div><div class="hex">#F5B5D2</div></div>
<div class="sw" style="border-color:#4E154F;box-shadow:var(--flx-glow-decidir)"><div class="name" style="color:#AB4B96">Decidir</div><div class="hex">#4E154F</div></div>
</div>
</body></html>
